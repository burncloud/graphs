[workload]
name = "rustburn/burncloud-ui -> burncloud/burncloud Dioxus console"
max_attempts = 3

[source]
url = "https://github.com/rustburn/burncloud-ui.git"
ref = "main"

[target]
url = "https://github.com/burncloud/burncloud.git"
ref = "main"

[agent]
# Example (configure locally; intentionally empty in-repo):
# command = ["codex", "exec", "--full-auto", "-C", "{target_dir}", "-"]
command = []
timeout_seconds = 1800

[contracts]
visual = "contracts/visual-language.md"
truth = "contracts/data-truth.md"

[verify]
page_commands = [
  "cargo fmt --all -- --check",
  "cargo check -p burncloud-client --no-default-features --features web"
]
cross_page_commands = [
  "bash crates/client/scripts/check-functional-wiring.sh",
  "bash crates/client/scripts/check-product-ux.sh"
]
final_commands = [
  "cargo fmt --all -- --check",
  "cargo check -p burncloud-client --no-default-features --features web"
]
truth_forbidden_claims = [
  "Pristine silicon attestation active",
  "SECURE TPM",
  "SIGNED BY ROOT",
  "INSANELY GREAT"
]

# All 16 routed React page components are represented below. `Home` covers both
# /home and /landing in the reference app.

[[pages]]
name = "public-home"
source = "src/pages/Home.tsx"
question = "What is BurnCloud, what can it truthfully promise, and how does a user enter the product?"
target_search = ["critical_pages", "landing", "home", "route_aliases"]
required = ["BurnCloud"]
forbidden = ["100% Cryptographically Traceable", "Zero Proxy Tampering", "VERIFIED SILICON", "99.999% Hardware Enclave Uptime"]
allowed_paths = ["crates/client/src/**", "crates/client/assets/**", "docs/ui/**"]
notes = "Preserve the premium public-site composition but downgrade every claim to what the real server/client evidence can prove."

[[pages]]
name = "login"
source = "src/pages/Login.tsx"
