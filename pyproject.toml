[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burncloud-graphs"
version = "0.1.0"
description = "Deterministic graph engineering harness for BurnCloud UI migrations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "BurnCloud"}]
dependencies = []

[project.scripts]
burncloud-graphs = "burncloud_graphs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
