[package]
name = "burncloud-graphs"
version = "0.2.0"
edition = "2024"
default-run = "burncloud-graphs"
description = "Rust-native Graph Engineering runtime for BurnCloud UI migrations"
license = "Apache-2.0"

[[bin]]
name = "burncloud-graphs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
