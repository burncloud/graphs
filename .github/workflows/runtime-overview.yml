name: Graph Runtime Overview

on:
  push:
    branches:
      - 'agent/ui-graph-harness'
  workflow_dispatch:

jobs:
  overview-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout graphs
        uses: actions/checkout@v4
        with:
          path: graphs

      - name: Checkout React reference
        uses: actions/checkout@v4
        with:
          repository: rustburn/burncloud-ui
          ref: main
          path: source

      - name: Checkout BurnCloud target
        uses: actions/checkout@v4
        with:
          repository: burncloud/burncloud
          ref: main
          path: target

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            graphs
            target

      - name: Build graph runtime and smoke agent
        working-directory: graphs
        run: cargo build --bin burncloud-graphs --bin overview-patch-agent

      - name: Download verified Overview migration patch
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri 'https://github.com/burncloud/burncloud/pull/423.diff' `
            -OutFile '${{ github.workspace }}/overview.patch'

      - name: Execute Rust UiGraph for Overview
        shell: pwsh
        working-directory: graphs
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $env:BURNCLOUD_GRAPHS_AGENT = Join-Path '${{ github.workspace }}' "graphs/target/debug/overview-patch-agent$suffix"
          $env:BURNCLOUD_GRAPHS_PATCH_FILE = Join-Path '${{ github.workspace }}' 'overview.patch'
          $graph = Join-Path '${{ github.workspace }}' "graphs/target/debug/burncloud-graphs$suffix"

          & $graph run workloads/runtime-overview-smoke.toml `
            --source-dir '${{ github.workspace }}/source' `
            --target-dir '${{ github.workspace }}/target' `
            --workspace '${{ github.workspace }}/graph-runtime' `
            --page overview `
            --no-branch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show machine-readable graph state
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem '${{ github.workspace }}/graph-runtime/runs' -Filter state.json -Recurse | ForEach-Object {
            Write-Host $_.FullName
            Get-Content $_.FullName
          }

      - name: Show graph-produced target commit
        if: success()
        shell: pwsh
        working-directory: target
        run: |
          git log -1 --format='graph_commit=%H%nsubject=%s%nauthor=%an <%ae>'
          git show --stat --oneline HEAD

      - name: Upload graph execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overview-rust-graph-runtime-evidence-${{ matrix.os }}
          path: graph-runtime/runs/**/state.json
          if-no-files-found: error
