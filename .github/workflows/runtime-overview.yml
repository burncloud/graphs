name: Graph Runtime Overview

on:
  push:
    branches:
      - 'agent/ui-graph-harness'
  workflow_dispatch:

jobs:
  overview-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout graphs
        uses: actions/checkout@v4
        with:
          path: graphs

      - name: Checkout React reference
        uses: actions/checkout@v4
        with:
          repository: rustburn/burncloud-ui
          ref: main
          path: source

      - name: Checkout BurnCloud target
        uses: actions/checkout@v4
        with:
          repository: burncloud/burncloud
          ref: main
          path: target

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            graphs
            target

      - name: Build graph runtime and smoke agent
        working-directory: graphs
        run: cargo build --bin burncloud-graphs --bin overview-patch-agent

      - name: Download verified Overview migration patch
        run: curl -fsSL https://github.com/burncloud/burncloud/pull/423.diff -o "${{ github.workspace }}/overview.patch"

      - name: Execute Rust UiGraph for Overview
        working-directory: graphs
        env:
          BURNCLOUD_GRAPHS_AGENT: ${{ github.workspace }}/graphs/target/debug/overview-patch-agent
          BURNCLOUD_GRAPHS_PATCH_FILE: ${{ github.workspace }}/overview.patch
        run: |
          ./target/debug/burncloud-graphs run workloads/runtime-overview-smoke.toml \
            --source-dir "${{ github.workspace }}/source" \
            --target-dir "${{ github.workspace }}/target" \
            --workspace "${{ github.workspace }}/graph-runtime" \
            --page overview \
            --no-branch

      - name: Show machine-readable graph state
        if: always()
        run: |
          find "${{ github.workspace }}/graph-runtime/runs" -name state.json -print -exec cat {} \;

      - name: Show graph-produced target commit
        if: success()
        working-directory: target
        run: |
          git log -1 --format='graph_commit=%H%nsubject=%s%nauthor=%an <%ae>'
          git show --stat --oneline HEAD

      - name: Upload graph execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overview-rust-graph-runtime-evidence
          path: graph-runtime/runs/**/state.json
          if-no-files-found: error
