name: Graph Harness CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: python -m pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python
        run: python -m compileall -q src tests

      - name: Validate full migration plan
        run: burncloud-graphs plan workloads/burncloud-ui-to-burncloud.toml
