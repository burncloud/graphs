name: Rustfmt Autofix

on:
  push:
    branches:
      - 'agent/ui-graph-harness'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/ui-graph-harness
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Rust sources already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml src
          git commit -m "Format Rust graph runtime"
          git push origin HEAD:agent/ui-graph-harness
